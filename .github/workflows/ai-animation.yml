name: AI Animation Studio

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "موضوع داستان را به فارسی بنویس"
        required: true
        default: "داستان عجیب و ترسناک حیوانات در جنگل"

permissions:
  contents: read

concurrency:
  group: ai-animation-studio
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Persian fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AI-Animation-Studio/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r AI-Animation-Studio/requirements.txt

      - name: Generate Persian narrated video
        env:
          FCC_BASE_URL: ${{ secrets.FCC_BASE_URL }}
          FCC_API_KEY: ${{ secrets.FCC_API_KEY }}
          FCC_MODEL: ${{ vars.FCC_MODEL }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          STORY_TOPIC: ${{ inputs.topic }}
        run: |
          python AI-Animation-Studio/generate.py --topic "$STORY_TOPIC"

      - name: Upload video and project outputs
        uses: actions/upload-artifact@v4
        with:
          name: ai-animation-video
          path: |
            AI-Animation-Studio/output/ai-animation.mp4
            AI-Animation-Studio/output/subtitles.srt
            AI-Animation-Studio/output/story.json
          if-no-files-found: error
          retention-days: 7
