name: Novel Reader Android Build

on:
  push:
    branches: [novel-app]
    paths:
      - "novel-app/**"
      - ".github/workflows/novel-reader.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Build debug APK
        run: gradle -p novel-app :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-debug-apk
          path: novel-app/app/build/outputs/apk/debug/app-debug.apk
