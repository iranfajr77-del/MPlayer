name: AI Animation Studio V2 Generate Test Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gradio client
        run: |
          python -m pip install --upgrade pip
          pip install "gradio_client>=1.5,<2" pillow

      - name: Generate 9:16 image-to-video test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python AI-Animation-Studio-v2/test_video.py

      - name: Upload generated test assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-animation-v2-test-video
          path: |
            AI-Animation-Studio-v2/output/character-reference.png
            AI-Animation-Studio-v2/output/ai-animation-v2-test.mp4
            AI-Animation-Studio-v2/output/test-metadata.json
          if-no-files-found: warn
          retention-days: 7
