name: AI Animation Studio V2 Generate

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe the vertical animated shot"
        required: true
        type: string
      duration:
        description: "Clip duration in seconds (Wan Space limit applies)"
        required: true
        default: "3.5"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r AI-Animation-Studio-v2/requirements.txt

      - name: Generate image and video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROMPT: ${{ inputs.prompt }}
          DURATION: ${{ inputs.duration }}
        run: |
          python AI-Animation-Studio-v2/generate.py --prompt "$PROMPT" --duration "$DURATION"

      - name: Upload generated clip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mplayer-ai-animation
          path: AI-Animation-Studio-v2/output/
          if-no-files-found: warn
          retention-days: 7
